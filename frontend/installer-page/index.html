<!doctype html>
<html lang="en" manifest="/cache.appcache">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoX DoN 3 Host Installer v[[VERSION_PLACEHOLDER]] (built [[BUILD_TIME_PLACEHOLDER]])</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #0f172a;
      background: -webkit-linear-gradient(180deg, #0f172a 0%, #0b1220 100%);
      color: #e2e8f0;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      min-height: 100%;
      text-align: center;
    }

    #footer {
      position: fixed;
      bottom: 12px;
      left: 50%;
      -webkit-transform: translateX(-50%);
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #4b5563;
      line-height: 1.5;
      text-align: center;
      z-index: 20;
    }

    main {
      max-width: 42rem;
      padding: 2rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.375rem;
      line-height: 1.5;
      color: #94a3b8;
    }

    #status {
      font-size: 1.5rem;
      font-weight: 500;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }

    #progressWrap {
      position: relative;
      width: 100%;
      max-width: 30rem;
      height: 1.25rem;
      margin: 1.75rem auto 0;
      background: #1b2436;
      border: 1px solid #2c3e5a;
      border-radius: 8px;
      overflow: hidden;
    }

    #progressBar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: #38bdf8;
      background: -webkit-linear-gradient(90deg, #2563eb 0%, #38bdf8 100%);
      -webkit-transform: scaleX(0);
      transform: scaleX(0);
      -webkit-transform-origin: left center;
      transform-origin: left center;
      -webkit-transition: -webkit-transform 0.3s ease-out;
      transition: transform 0.3s ease-out;
    }

    #progressPct {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <main>
    <h1>VoX DoN 3 Host Installer</h1>
    <p id="status">Loading&hellip;</p>
    <p id="detail"></p>

    <div id="progressWrap" hidden>
      <div id="progressBar"></div>
      <div id="progressPct">0%</div>
    </div>
  </main>

  <footer id="footer">VoX DoN 3 Host Installer v[[VERSION_PLACEHOLDER]] (built [[BUILD_TIME_PLACEHOLDER]])</footer>

  <script>
    (function () {
      'use strict';

      var statusEl = document.getElementById('status');
      var detailEl = document.getElementById('detail');
      var progressWrap = document.getElementById('progressWrap');
      var progressBar = document.getElementById('progressBar');
      var progressPct = document.getElementById('progressPct');
      var completed = false;

      function setProgress(pct) {
        progressBar.style.transform = 'scaleX(' + pct / 100 + ')';
        progressPct.textContent = pct + '%';
      }

      function setInstalled() {
        statusEl.textContent = 'Installed successfully';
        statusEl.style.color = '#22c55e';
        progressBar.style.background = '-webkit-linear-gradient(90deg, #16a34a 0%, #22c55e 100%)';
        detailEl.textContent = 'The VoX DoN 3 Host shortcut is now on your PS5 homescreen. You can close this page.';
        setProgress(100);
      }

      function setFailed() {
        statusEl.textContent = 'Install failed';
        statusEl.style.color = '#ef4444';
        progressBar.style.background = '-webkit-linear-gradient(90deg, #dc2626 0%, #ef4444 100%)';
        detailEl.textContent = 'The app could not be installed. Close this page and re-run the installer.';
      }

      function setSlow() {
        statusEl.textContent = 'Caching is taking unusually long';
        detailEl.textContent = 'The shortcut is only created after the cache finishes. If this never completes, close the browser and re-run the installer.';
      }

      function setCaching() {
        statusEl.textContent = 'Caching content...';
        detailEl.textContent = 'Please wait a moment. Do not close this page yet!';
        progressWrap.hidden = false;
      }

      function probeServer() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/version', true);
        xhr.timeout = 1000;
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              setCaching();
            } else {
              /* Server is gone (rebooted?) — nothing to cache, just exit the loop. */
              completed = true;
            }
          }
        };
        xhr.onerror = function () { completed = true; };
        xhr.ontimeout = function () { completed = true; };
        xhr.send();
      }

      function installApp() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/install', true);
        xhr.timeout = 30000;
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              setInstalled();
            } else {
              setFailed();
            }
          }
        };
        xhr.onerror = function () { setFailed(); };
        xhr.ontimeout = function () { setFailed(); };
        xhr.send();
      }

      function maybeInstall() {
        if (completed) return;
        completed = true;
        installApp();
      }

      window.addEventListener('load', function () {
        probeServer();

        /* The shortcut is created only once the AppCache is current, so the
           installer never installs a partial cache. /install then both installs
           the homescreen app and stops the server. */
        var waitTimer = setInterval(function () {
          if (completed) {
            clearInterval(waitTimer);
            return;
          }
          var st = window.applicationCache
              ? window.applicationCache.status : -1;
          if (st === -1 || st === window.applicationCache.IDLE) {
            clearInterval(waitTimer);
            maybeInstall();
          }
        }, 1000);

        /* Safety cap — never leave the installer hanging on screen. */
        setTimeout(function () {
          if (!completed) {
            setSlow();
          }
        }, 120000);
      });

      if (window.applicationCache) {
        window.applicationCache.addEventListener('progress', function (e) {
          if (e.total && e.total > 0) {
            setProgress(Math.min(99, Math.round((e.loaded / e.total) * 100)));
          }
        });
        window.applicationCache.addEventListener('error', function () {
          /* Ignore; the retry loop keeps waiting. */
        });
        window.applicationCache.addEventListener('cached', function () {
          maybeInstall();
        });
        window.applicationCache.addEventListener('noupdate', function () {
          maybeInstall();
        });
        window.applicationCache.addEventListener('updateready', function () {
          if (window.applicationCache.status === window.applicationCache.UPDATEREADY) {
            window.applicationCache.swapCache();
            window.location.reload();
          }
        });
      }
    })();
  </script>
</body>

</html>
